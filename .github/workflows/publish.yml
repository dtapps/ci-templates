# 发布工作流：与 CNB 的 .cnb/workflows/publish.yml 对齐。
#
# 本仓库发布的是一个 npm 包（内容 = scripts/ 下的 shell 脚本 + dist/ 下的压缩副本，
# 由 package.json 的 files 字段决定），同时打 tag + 建 Release。
#
# 三个平台各发各的，包名/注册表不同：
#   * GitHub Packages  -> @dtapps/ci-templates（scope 必须与仓库 owner 一致），本文件发布
#   * npm 公共源       -> @dtapp/ci-templates ，由 publish-npm.yml 发布（见末尾 job）
#   * CNB 制品库       -> @dtapp/ci-templates ，由 .cnb/workflows/publish.yml 发布
#
# 两种触发共用同一套步骤：
#   * 每天 00:00 定时发 nightly（VERSION=nightly 自动展开为 <最新正式版+1补丁>-nightly.<UTC 日期>）
#   * workflow_dispatch 手动填 version（semver 或 nightly），发布触发分支的当前提交
#
# 版本门禁：独立 job version-gate 先用 resolve-version.sh 算出最终 Tag，再用
# dtapps/release-version-action@main 解析并校验该 Tag；校验通过后，release 与
# publish-npm job 才执行构建、打包、部署（两者均 needs: version-gate）。
#
# 标题统一为「ci-templates v1.2.3」；Release 正文由 dtapps/release-changelog-action@main
# 以 mode: changelog 生成，写入文件后交给 action-gh-release 发布，不再用平台自动 Release Notes。
#
# 包版本已存在则跳过门禁校验与后续全部步骤（工作流保持成功）：npm 版本不可覆盖，
# 需要新 Release 就升版本号。version 规则见 scripts/ci/resolve-version.sh。
#
# https://github.com/actions/checkout
# https://github.com/softprops/action-gh-release
name: Release Package

on:
  schedule:
    # GitHub 的 cron 固定使用 UTC。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号：1.2.3 / 1.2.3-rc.1 / 1.2.3-nightly.20260101；填 nightly 自动展开'
        required: true
        type: string
        default: nightly

permissions:
  contents: write
  packages: write
  pull-requests: write
  # npm trusted publishing（OIDC）要求「调用方 + 被调用方」都给 id-token: write；
  # 这里给工作流级兜底，实际只用在下面对 publish-npm 的调用上。
  id-token: write

# 发布目标统一在这里维护。注意不要叫 NPM_REGISTRY：
# scripts/ci/resolve-version.sh 会用同名变量查基准版本，那必须继续指向 CNB 制品库。
env:
  PUBLISH_NAME: '@dtapps/ci-templates'
  PUBLISH_SCOPE: '@dtapps'
  PUBLISH_REGISTRY: https://npm.pkg.github.com

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 独立版本门禁：解析 Tag、校验与 Git Tag 的一致性；失败时下游 job 全部不执行。
  version-gate:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/dtapps/golang:latest
      env:
        GIT_SHIM_SAFE_DIRECTORY: 'true'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag: ${{ steps.version.outputs.TAG }}
      channel: ${{ steps.version.outputs.CHANNEL }}
      dist_tag: ${{ steps.version.outputs.DIST_TAG }}
      prerelease: ${{ steps.version.outputs.PRERELEASE }}
      latest: ${{ steps.version.outputs.LATEST }}
      exists: ${{ steps.version_exists.outputs.exists }}
    env:
      VERSION: ${{ github.event_name == 'schedule' && 'nightly' || inputs.version }}
    steps:
      # fetch-depth: 0 是必需的：校验 Tag、nightly 基准都要读历史 tag。
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: 解析版本
        id: version
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/resolve-version.sh
          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done < .version.env

      # 判断依据：包版本号（npm view 的 versions），不用 tag —— tag 会被删/重建，
      # 同一提交上还可能有多个 tag。已存在则门禁跳过 Tag 校验，下游也全部跳过。
      # 查询失败（网络/权限）按“不存在”继续，发布步骤自带版本冲突容错兜底。
      - name: 检查包版本是否已存在
        id: version_exists
        shell: bash
        env:
          CHECK_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          set +e
          found="$(npm view "${PUBLISH_NAME}@${CHECK_VERSION}" version --registry "$PUBLISH_REGISTRY" 2>/dev/null)"
          rc=$?
          set -e
          exists=false
          if [ "$rc" -eq 0 ] && [ -n "$found" ]; then
            exists=true
          elif [ "$rc" -ne 0 ]; then
            echo "::warning::查询包版本失败（npm view 返回 $rc），按“不存在”继续；发布步骤会做版本冲突容错"
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "包 ${PUBLISH_NAME}@${CHECK_VERSION} 是否已存在：${exists}"

      # 插件只做版本解析与 Tag 校验，不执行 git checkout，也不创建/删除 Release/Tag。
      # 这里有意不传 commit 参数（已废弃）：Tag 由 resolve-version.sh 计算，Action 只校验它。
      - name: 解析版本号（release-version-action）
        id: resolve_version
        uses: dtapps/release-version-action@main
        with:
          mode: parse
          version: ${{ steps.version.outputs.TAG }}
          fetch_tags: false

      - name: 校验解析结果与 Tag 一致
        shell: bash
        env:
          EXPECTED_TAG: ${{ steps.version.outputs.TAG }}
          EXPECTED_VERSION: ${{ steps.version.outputs.VERSION }}
          RESOLVED_TAG: ${{ steps.resolve_version.outputs.tag }}
          RESOLVED_VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$RESOLVED_TAG" != "$EXPECTED_TAG" ] || [ "$RESOLVED_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::版本解析结果与 Tag 不一致：期望 ${EXPECTED_TAG}/${EXPECTED_VERSION}，实际 ${RESOLVED_TAG}/${RESOLVED_VERSION}"
            exit 1
          fi
          echo "版本解析结果与 Tag 一致：${EXPECTED_TAG}"

      # 包版本已存在时连 Tag 校验一起跳过：同名正式版/预发布 Tag 会被 Action 判重复而失败，
      # 但这种情况下后续发布步骤本来就要全部跳过，工作流必须保持成功。
      # nightly 允许同名 Tag 存在，因为后续会删除旧 Release/Tag 再重建。
      - name: 校验版本号与 Tag（release-version-action）
        id: validate
        if: steps.version_exists.outputs.exists != 'true'
        uses: dtapps/release-version-action@main
        with:
          mode: validate
          version: ${{ steps.resolve_version.outputs.tag }}
          fetch_tags: true
          allow_existing_nightly: ${{ steps.resolve_version.outputs.channel == 'nightly' }}

      - name: 版本门禁摘要
        shell: bash
        env:
          EXISTS: ${{ steps.version_exists.outputs.exists }}
          TAG: ${{ steps.version.outputs.TAG }}
        run: |
          set -euo pipefail
          if [ "$EXISTS" = "true" ]; then
            echo "::notice::包版本已存在，跳过 Tag 校验；release 与 publish-npm job 将跳过全部后续步骤"
          else
            echo "::notice::版本门禁通过：${TAG}"
          fi

  release:
    needs: version-gate
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/dtapps/golang:latest
      env:
        GIT_SHIM_SAFE_DIRECTORY: 'true'
    # 解析出的版本号来自 version-gate，传给下面的 publish-npm（workflow_call），
    # 保证门禁、Release 与 npm 发布用的是同一个版本。
    outputs:
      version: ${{ needs.version-gate.outputs.version }}
      tag: ${{ needs.version-gate.outputs.tag }}
      exists: ${{ needs.version-gate.outputs.exists }}
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # fetch-depth: 0 是必需的：Release Notes 的 diff 要读历史 tag。
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      # 容器镜像 ghcr.io/dtapps/golang 自带 Node/npm，不再用 setup-node 重复安装。
      # setup-node 的 registry-url 其实只做两件事，这里手写等价内容：
      #   1. 往 .npmrc 写 registry / @scope:registry，指定发布源；
      #   2. 写 //host/:_authToken=${NODE_AUTH_TOKEN}，npm publish 时据此带令牌。
      - name: 配置 npm 认证与发布 scope
        shell: bash
        run: |
          set -euo pipefail
          host="${PUBLISH_REGISTRY#https://}"
          host="${host%/}"
          npm config set registry "$PUBLISH_REGISTRY"
          npm config set "${PUBLISH_SCOPE}:registry" "$PUBLISH_REGISTRY"
          npm config set "//${host}/:_authToken" '${NODE_AUTH_TOKEN}'
          echo "npm $(npm -v) / node $(node -v)"
          cat "$HOME/.npmrc"

      # 发布正文由 release-changelog-action（mode: changelog）生成；必须先于删除旧 tag，
      # 否则会失去基准 Tag。Action 失败时兜底为“首次发布”，不阻断发布。
      - name: 生成 Release 正文
        id: changelog
        if: needs.version-gate.outputs.exists != 'true'
        continue-on-error: true
        uses: dtapps/release-changelog-action@main
        with:
          mode: changelog
          version: ${{ needs.version-gate.outputs.tag }}
          out_file: RELEASE_BODY.md
          changelog_limit: 50
          fetch_tags: true
          fetch_history: true

      - name: 准备发布正文
        if: needs.version-gate.outputs.exists != 'true'
        shell: bash
        env:
          BODY_FILE: ${{ steps.changelog.outputs.body_file }}
        run: |
          set -euo pipefail
          if [ -z "$BODY_FILE" ] || [ ! -f "$BODY_FILE" ]; then
            printf '首次发布\n' > RELEASE_BODY.md
          fi

      # 重跑同一版本时先删掉旧的 Release 与 tag，保证下面能重新创建。
      - name: 删除同名旧 Release 与 tag（如果存在）
        if: needs.version-gate.outputs.exists != 'true'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_TO_DELETE: ${{ needs.version-gate.outputs.tag }}
        run: sh scripts/ci/delete-release.sh --platform github --tag "$TAG_TO_DELETE"

      # 包内的 dist/ 是 scripts/ 的压缩副本（make minify-shell 的产物），
      # 平时被 .gitignore 忽略，发布前现生成；生成失败说明脚本本身有问题，直接拦住发布。
      - name: 生成 dist 压缩副本
        if: needs.version-gate.outputs.exists != 'true'
        shell: bash
        run: bash scripts/minify.sh shell

      - name: 创建标签
        if: needs.version-gate.outputs.exists != 'true'
        shell: bash
        env:
          TAG: ${{ needs.version-gate.outputs.tag }}
          TAG_COMMIT: ${{ github.sha }}
        run: bash scripts/ci/nightly-tag.sh

      # GitHub Packages 上的包名必须是 @<repo owner>/...，与 npm 公共源、CNB 制品库不同，
      # 所以发布前改 package.json 的 name；files 字段（scripts + dist）保持不变。
      - name: 写入版本号与 GitHub Packages 包名
        if: needs.version-gate.outputs.exists != 'true'
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.version-gate.outputs.version }}
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const p=require('./package.json');p.version=process.env.PACKAGE_VERSION;p.name=process.env.PUBLISH_NAME;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "将要发布：$(node -p "require('./package.json').name + '@' + require('./package.json').version")"
          # npm pack --json 在新版输出「以包名为 key 的对象」，旧版是数组，两种都兼容。
          npm pack --dry-run --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const raw=JSON.parse(s);const j=Array.isArray(raw)?raw[0]:raw[Object.keys(raw)[0]];console.log("包内文件 "+j.files.length+" 个，共 "+j.size+" 字节")})'

      - name: 创建 Release
        if: needs.version-gate.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version-gate.outputs.tag }}
          # 标题格式：CITemplates v1.2.3
          name: CITemplates ${{ needs.version-gate.outputs.tag }}
          prerelease: ${{ needs.version-gate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version-gate.outputs.latest }}
          # 正文来自上面的 release-changelog-action；文件不存在时已兜底为“首次发布”
          body_path: RELEASE_BODY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # protect 保住正式版、latest/stable 与 rc/beta/alpha，避免 by_count 误删非 nightly 版本；
      # dry_run 必须显式为 false，否则插件默认只列出待删除版本。
      # 包版本已存在时连清理一起跳过：delete_git_tag 会删掉已有 Release 依赖的 tag。
      - name: 清理旧 nightly（只保留最近 3 个）
        if: needs.version-gate.outputs.exists != 'true'
        uses: dtapps/release-cleaner-action@main
        continue-on-error: true
        with:
          mode: by_count
          keep: 3
          protect: '^(v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)[.-]?[0-9A-Za-z.-]*)?|latest|stable)$'
          delete_git_tag: true
          dry_run: false

      # Release 已成功后再发布 npm；前面任一步失败都不会动制品库。
      - name: 发布到 GitHub Packages
        if: needs.version-gate.outputs.exists != 'true'
        shell: bash
        env:
          DIST_TAG: ${{ needs.version-gate.outputs.dist_tag }}
        run: |
          set -euo pipefail
          set +e
          # --access public：scoped 包默认按 private 处理，显式声明公开可避免被当成私有包收费。
          out="$(npm publish --tag "$DIST_TAG" --access public --registry "$PUBLISH_REGISTRY" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            # 只有不带 -rc/-beta/-alpha/-nightly 后缀的正式版才该占 latest；
            # npm 对「首个版本」有兜底行为，这里核对一次，串了只告警不改写。
            latest="$(npm view "$PUBLISH_NAME" dist-tags.latest --registry "$PUBLISH_REGISTRY" 2>/dev/null || true)"
            echo "latest 当前指向：${latest:-<未设置>}（本次 dist-tag=${DIST_TAG}）"
            case "$latest" in
              *-*)
                if [ "$DIST_TAG" != "latest" ]; then
                  echo "::warning::latest 指向预发布版本 ${latest}；发一个正式版（无 -rc/-beta/-alpha/-nightly 后缀）即会自动纠正"
                fi
                ;;
            esac
            exit 0
          fi
          # npm 包版本不可变；同版本重跑时 tag / Release 已重建，包沿用已发布的即可。
          if printf '%s' "$out" | grep -Eqi 'previously published|already exists|existing version|409 conflict|E409'; then
            echo "::warning::包版本已存在，npm 不支持覆盖，沿用已发布版本"
            exit 0
          fi
          exit "$rc"

  # 复制出来的 npm 公共源工作流：版本门禁通过后，用同样的版本号调用。
  # 用 workflow_call 而不是 workflow_run，是为了避免重新猜版本（tag 反推会取错）。
  # 这里不按 GitHub Packages 的检查结果跳过：三个源相互独立，版本是否已存在
  # 由 publish-npm.yml 自己的门禁查 npm 公共源判定。
  publish-npm:
    needs: [version-gate, release]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    with:
      version: ${{ needs.version-gate.outputs.version }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
