branch:
  - buttons:
      - name: 发布 npm
        description: 按 version 渠道发布到 npm 制品库并创建 Release
        event: web_trigger_publish
        inputs:
          version:
            name: 版本号
            description: semver（如 1.2.3 或 1.2.3-rc.1），或填 nightly 自动展开为 <最近正式版+1补丁>-nightly.<UTC日期>
            type: input
            required: true
            default: nightly
            placeholder: 1.2.3 / 1.2.3-rc.1 / nightly
          commit:
            name: 提交 SHA
            description: 要发布的提交，留空则使用当前分支最新提交
            type: input
            required: false
            placeholder: 留空 = 分支 HEAD
      - name: 生成 Code Wiki
        description: 重新分析仓库并生成 Code Wiki 文档
        event: web_trigger_codewiki # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer
