# CNB 云原生构建：版本门禁 + npm 打包 + 发布 + Release 管理
#
# 本文件由 .cnb.yml 的 include 引入，只负责发布。
# 本仓库发布的是一个 npm 包（内容 = scripts/ 下的 shell 脚本 + dist/ 下的压缩副本，
# 由 package.json 的 files 字段决定），并发 tag + 建 Release。
# 三个平台各发各的，包名/注册表不同：
#   * CNB 制品库       -> @dtapp/ci-templates（本文件发布）
#   * GitHub Packages  -> @dtapps/ci-templates（见 .github/workflows/publish.yml）
#   * npm 公共源       -> @dtapp/ci-templates（见 .github/workflows/publish-npm.yml）
#
# 两种触发共用同一份定义（见下面的 &version_gate / &trigger_release 锚点；
# CNB 不支持跨文件锚点，所以整条 stages 必须留在本文件内）：
#   * crontab：每天 00:00（北京时间）自动跑，不注入 version，插件兜底成 nightly。
#   * web_trigger：手动点「发布」按钮，页面表单填 version（见 .cnb/web_trigger.yml），
#     直接用别名 *version_gate / *trigger_release 引用同一份流水线。CNB 按 input key
#     原样注入环境变量，即小写 $version；门禁流水线按 $VERSION > $version > nightly
#     读取输入后交给 release-version 插件解析。
#
# 版本门禁：version-gate 流水线用 docker.cnb.cool/dtapp/plugins/release-version:latest
# 解析版本号并校验与 Tag 一致；通过后用 cnb:resolve 发通知，发布流水线的 cnb:await
# 等到通知才执行构建、打包、部署。两个内置步骤的 key 必须配对，且只能放在 stages 中
# （不能放 endStages / failStages）。
#
# 入参 version 规则见 release-version 插件：
#   1.2.3                  -> 正式版，Release 不勾选 prerelease，npm dist-tag=latest
#   1.2.3-rc.1             -> 预发布（rc 渠道）
#   1.2.3-beta.1           -> 预发布（beta 渠道）
#   1.2.3-alpha.1          -> 预发布（alpha 渠道）
#   1.2.3-nightly.20260101 -> 预发布（nightly 渠道）
#   nightly                -> <最近正式版 + 1 补丁>-nightly.<北京时间日期>，每天一个 tag
#
# 制品库地址需写死（本仓库自己的通用 npm 制品库，独立于其它仓库）：
#   https://npm.cnb.cool/dtapp/ci-templates/-/packages/
#   包名读 package.json（兜底 @${CNB_GROUP_SLUG_LOWERCASE}/${CNB_REPO_NAME_LOWERCASE}）
#   发布令牌用云原生构建内置 $CNB_TOKEN
# 零依赖（纯 shell + node 自带的 fetch），直接用镜像自带的 node / npm。
# 发布固定使用本次触发提交。
.version_gate: &version_gate
  name: 版本门禁
  env:
    GIT_SHIM_SAFE_DIRECTORY: 'true'
    PUBLISH_NAME: '@dtapp/ci-templates'
    PUBLISH_SCOPE: '@dtapp'
    PUBLISH_REGISTRY: https://npm.cnb.cool/dtapp/ci/-/packages/
  runner:
    tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
  docker:
    image: docker.cnb.cool/dtapp/golang:latest # 统一使用预构建的 CI 环境镜像
  stages:
    - name: 读取版本输入
      script: |
        set -e
        raw="${VERSION:-${version:-nightly}}"
        echo "原始版本输入：${raw}"
        echo "##[set-output RAW_VERSION=${raw}]"
      exports:
        RAW_VERSION: RAW_VERSION

    - name: 解析版本号（release-version）
      image: docker.cnb.cool/dtapp/plugins/release-version:latest
      settings:
        mode: parse
        version: $RAW_VERSION
        default_nightly: true
        fetch_tags: true
        nightly_fallback: zero
      exports:
        tag: TAG
        version: VERSION
        channel: CHANNEL

    - name: 计算发布参数
      script: |
        set -e
        case "$CHANNEL" in
          stable)
            # 插件把未识别的预发布后缀归为 stable；仍按预发布处理，dist-tag=next。
            if [ "${VERSION#*-}" != "$VERSION" ]; then
              DIST_TAG=next
              PRERELEASE=true
              LATEST=false
            else
              DIST_TAG=latest
              PRERELEASE=false
              LATEST=true
            fi
            ;;
          rc|beta|alpha|nightly)
            DIST_TAG="$CHANNEL"
            PRERELEASE=true
            LATEST=false
            ;;
          *)
            DIST_TAG=next
            PRERELEASE=true
            LATEST=false
            ;;
        esac
        echo "##[set-output DIST_TAG=${DIST_TAG}]"
        echo "##[set-output PRERELEASE=${PRERELEASE}]"
        echo "##[set-output LATEST=${LATEST}]"
      exports:
        DIST_TAG: DIST_TAG
        PRERELEASE: PRERELEASE
        LATEST: LATEST

    - name: 校验解析结果与 Tag 一致
      script: |
        set -e
        lower="$(printf '%s' "$TAG" | tr '[:upper:]' '[:lower:]')"
        if [ "$lower" != "v${VERSION}" ]; then
          echo "版本解析结果与 Tag 不一致：tag=${TAG}，version=${VERSION}" >&2
          exit 1
        fi
        echo "版本解析结果与 Tag 一致：${TAG}"

    # 判断依据：包版本号（registry 的 versions），不用 tag —— tag 会被删/重建，
    # 同一提交上还可能有多个 tag。包版本已存在时跳过 Tag 校验与后续全部步骤，
    # 工作流保持成功（不报错）；需要新 Release 就升版本号。
    # 查询失败（网络/权限）按“不存在”继续，发布步骤自带版本冲突容错兜底，不阻断流程。
    - name: 检查包版本是否已存在
      script: |
        set -e
        # 查询失败（node/fetch 不可用、网络或权限问题）也不能让本步骤失败：
        # 按“不存在”继续，发布步骤自带版本冲突容错兜底，工作流保持成功。
        set +e
        EXISTS="$(node -e '
          const name = process.env.PUBLISH_NAME;
          const version = process.env.VERSION;
          const registry = process.env.PUBLISH_REGISTRY.replace(/\/+$/, "") + "/";
          const url = registry + name.replace(/\//g, "%2F");
          fetch(url, { headers: { accept: "application/json", authorization: `Bearer ${process.env.CNB_TOKEN}` } })
            .then(r => {
              if (!r.ok) {
                process.stderr.write(`查询包版本失败：HTTP ${r.status}，按“不存在”继续（发布时会做版本冲突容错）\n`);
                return {};
              }
              return r.json();
            })
            .then(j => process.stdout.write(
              j.versions && Object.prototype.hasOwnProperty.call(j.versions, version) ? "true" : "false"
            ))
            .catch(e => {
              process.stderr.write(`查询包版本失败：${e.message}，按“不存在”继续（发布时会做版本冲突容错）\n`);
              process.stdout.write("false");
            });
        ')"
        rc=$?
        set -e
        if [ "$rc" -ne 0 ] || { [ "$EXISTS" != "true" ] && [ "$EXISTS" != "false" ]; }; then
          echo "查询包版本失败（node 退出 $rc，输出：${EXISTS:-<空>}），按“不存在”继续" >&2
          EXISTS=false
        fi
        echo "包 ${PUBLISH_NAME}@${VERSION} 是否已存在：${EXISTS}"
        echo "##[set-output EXISTS=${EXISTS}]"
      exports:
        VERSION_EXISTS: EXISTS

    # 校验复用上面 parse 输出的 Tag；不传 commit 参数（已废弃），
    # 插件不执行 git checkout，也不创建/删除 Release/Tag。
    # 包版本已存在时连 Tag 校验一起跳过：同名正式版/预发布 Tag 会被插件判重复而失败，
    # 但这种情况下后续发布步骤本来就要全部跳过，工作流必须保持成功。
    # nightly 允许同名 Tag 存在，因为后续会删除旧 Release/Tag 再重建。
    - name: 校验版本号与 Tag（release-version）
      if: |
        [ "$VERSION_EXISTS" != "true" ]
      image: docker.cnb.cool/dtapp/plugins/release-version:latest
      settings:
        mode: validate
        version: $TAG
        fetch_tags: true
        allow_existing_nightly: true
      exports:
        validated: VERSION_VALIDATED
        latest_stable: LATEST_STABLE

    - name: 版本门禁摘要
      script: |
        set -e
        if [ "$VERSION_EXISTS" = "true" ]; then
          echo "包版本已存在，跳过 Tag 校验；发布流水线将跳过全部后续步骤"
        else
          echo "版本门禁通过：${TAG}（validated=${VERSION_VALIDATED:-}）"
        fi

    # 通知发布流水线：key 与下面 cnb:await 必须一致，且只能放在 stages 中。
    # data 把门禁算出的版本参数原样传给发布流水线，避免两条流水线各自解析出不同版本。
    - name: 通知版本门禁通过
      type: cnb:resolve
      options:
        key: ci-templates-release-version-gate
        data:
          VERSION: $VERSION
          TAG: $TAG
          CHANNEL: $CHANNEL
          DIST_TAG: $DIST_TAG
          PRERELEASE: $PRERELEASE
          LATEST: $LATEST
          VERSION_EXISTS: $VERSION_EXISTS

.trigger_release: &trigger_release
  name: 发布
  env:
    GIT_SHIM_SAFE_DIRECTORY: 'true'
    PUBLISH_NAME: '@dtapp/ci-templates'
    PUBLISH_REGISTRY: https://npm.cnb.cool/dtapp/ci/-/packages/
  runner:
    tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
  docker:
    image: docker.cnb.cool/dtapp/golang:latest # 统一使用预构建的 CI 环境镜像
  stages:
    # 等待版本门禁流水线；exports 把 cnb:resolve 的 data 映射为本流水线环境变量。
    # 门禁未通过（流水线失败）时这里会因 dead lock found 失败，后续步骤一律不执行。
    - name: 等待版本门禁
      type: cnb:await
      options:
        key: ci-templates-release-version-gate
      exports:
        VERSION: VERSION
        TAG: TAG
        CHANNEL: CHANNEL
        DIST_TAG: DIST_TAG
        PRERELEASE: PRERELEASE
        LATEST: LATEST
        VERSION_EXISTS: VERSION_EXISTS

    - name: 包版本已存在，跳过后续步骤
      if: |
        [ "$VERSION_EXISTS" = "true" ]
      script: echo "包版本已存在，跳过后续全部步骤"

    # 发布正文由 release-changelog 插件（mode: changelog）生成；必须先于删除旧 tag，
    # 否则会失去基准 Tag。失败时兜底为“首次发布”，不阻断发布。
    - name: 生成 Release 正文
      if: |
        [ "$VERSION_EXISTS" != "true" ]
      image: docker.cnb.cool/dtapp/plugins/release-changelog:latest
      allowFailure: true
      settings:
        mode: changelog
        version: $TAG
        out_file: LATEST_CHANGELOG.md
        changelog_limit: 50
        fetch_tags: true
        fetch_history: true
      exports:
        body_file: RELEASE_BODY_FILE
        previous_tag: PREVIOUS_TAG
        commit_count: RELEASE_COMMIT_COUNT

    - name: 准备发布参数
      if: |
        [ "$VERSION_EXISTS" != "true" ]
      script: |
        if [ ! -f LATEST_CHANGELOG.md ]; then
          echo "首次发布" > LATEST_CHANGELOG.md
        fi

    # 重跑同一版本时先删掉旧的 Release 与 tag，保证下面能重新创建。
    # tag 也可能已经被删过，这里允许失败，不阻断发布。
    - name: 删除同名旧 Release 与 tag（如果存在）
      if: |
        [ "$VERSION_EXISTS" != "true" ]
      allowFailure: true
      script: sh scripts/ci/delete-release.sh --platform cnb --tag "$TAG"

    # 包内的 dist/ 是 scripts/ 的压缩副本（make minify-shell 的产物），
    # 平时被 .gitignore 忽略，发布前现生成；生成失败说明脚本本身有问题，直接拦住发布。
    - name: 生成 dist 压缩副本
      if: |
        [ "$VERSION_EXISTS" != "true" ]
      script: bash scripts/minify.sh shell

    - name: 写入版本号与包名到 package.json
      if: |
        [ "$VERSION_EXISTS" != "true" ]
      script: |
        set -e
        node -e "const fs=require('fs');const p=require('./package.json');p.version=process.env.VERSION;p.name=process.env.PUBLISH_NAME;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
        echo "将要发布：$(node -p "require('./package.json').name + '@' + require('./package.json').version")"

    - name: 创建标签
      if: |
        [ "$VERSION_EXISTS" != "true" ]
      script: bash scripts/ci/nightly-tag.sh

    - name: 创建 Release
      type: git:release
      if: |
        [ "$VERSION_EXISTS" != "true" ]
      options:
        tag: $TAG
        title: CITemplates $TAG
        descriptionFromFile: LATEST_CHANGELOG.md
        preRelease: $PRERELEASE
        latest: $LATEST

    # protect 保住正式版、latest/stable 与 rc/beta/alpha，避免 by_count 误删非 nightly 版本；
    # dry_run 必须显式为 false，否则插件默认只列出待删除版本。
    # 包版本已存在时连清理一起跳过：delete_git_tag 会删掉已有 Release 依赖的 tag。
    - name: 清理旧 nightly（只保留最近 3 个）
      if: |
        [ "$VERSION_EXISTS" != "true" ]
      image: docker.cnb.cool/dtapp/plugins/release-cleaner:latest
      allowFailure: true
      settings:
        mode: by_count
        keep: 3
        protect: '^(v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)[.-]?[0-9A-Za-z.-]*)?|latest|stable)$'
        delete_git_tag: true
        dry_run: false

    # Release 已成功后再发布 npm；前面任一步失败都不会动制品库。
    - name: 发布到制品库
      image: tencentcom/npm
      if: |
        [ "$VERSION_EXISTS" != "true" ]
      settings:
        username: $CNB_TOKEN_USER_NAME
        token: $CNB_TOKEN
        email: $CNB_COMMITTER_EMAIL
        registry: $PUBLISH_REGISTRY
        folder: ./
        tag: $DIST_TAG
        access: public
        fail_on_version_conflict: false

main:
  # 定时（每天 00:00，北京时间）与手动（web_trigger 按钮）共用同一份流水线定义。
  # 每个事件都有两条并发流水线：版本门禁通过后，发布流水线才继续执行。
  # 注意：门禁流水线读取版本输入的优先级是 $VERSION > $version > nightly；
  # 不要在 job env 里写死 VERSION，否则会覆盖 web_trigger 表单注入的小写 $version。
  'crontab: 0 0 * * *':
    - *version_gate
    - *trigger_release

  # 手动执行：version 由 .cnb/web_trigger.yml 的 inputs 表单注入。
  web_trigger_publish:
    - *version_gate
    - *trigger_release
